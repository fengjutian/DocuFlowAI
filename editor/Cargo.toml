[workspace]
resolver = "2"
members = [
    "crates/agent-acp",
    "crates/agent-ui",
    "crates/app",
    "crates/diff",
    "crates/editor-core",
    "crates/lsp",
    "crates/platform",
    "crates/render",
    "crates/syntax",
    "crates/text",
    "crates/ui",
    "crates/workbench",
    "crates/workspace",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Proprietary"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.100"
bytemuck = { version = "1.24.0", features = ["derive"] }
glyphon = "0.9.0"
pollster = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.17"
wgpu = "25.0.2"
winit = "0.30.12"

[profile.dev]
debug = 1

# The grammar crates compile C with a command line that is too long for the
# MSVC debug record, so the compiler gives up with `D8050`. Without the debug
# information the command line fits again. Cargo has no wildcards here, so
# every grammar crate needs its own line.
[profile.dev.package.tree-sitter]
debug = false

[profile.dev.package.tree-sitter-c]
debug = false

[profile.dev.package.tree-sitter-cpp]
debug = false

[profile.dev.package.tree-sitter-go]
debug = false

[profile.dev.package.tree-sitter-javascript]
debug = false

[profile.dev.package.tree-sitter-json]
debug = false

[profile.dev.package.tree-sitter-python]
debug = false

[profile.dev.package.tree-sitter-rust]
debug = false

[profile.dev.package.tree-sitter-typescript]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

