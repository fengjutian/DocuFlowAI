[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/platform",
    "crates/render",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.100"
bytemuck = { version = "1.24.0", features = ["derive"] }
glyphon = "0.9.0"
pollster = "0.4.0"
thiserror = "2.0.17"
wgpu = "25.0.2"
winit = "0.30.12"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

